<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Safy Or Nothing ♥</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0d0a1a; font-family: -apple-system, Georgia, serif; }
  #hub { position:fixed; inset:0; background:radial-gradient(ellipse at 50% 15%, #2a1f4a, #0d0a1a 75%); display:flex; flex-direction:column; align-items:center; padding:26px 20px; overflow-y:auto; z-index:10; }
  #hub.hidden { display:none; }
  .hubTitle { font-size:26px; color:#fdf3e2; letter-spacing:2px; margin:6px 0 2px; text-shadow:0 0 12px rgba(232,184,109,0.4); }
  .hubHeart { color:#e0475a; }
  .hubSub { font-size:12.5px; color:#a89bc9; margin-bottom:22px; text-align:center; }
  .levelGrid { display:grid; grid-template-columns:1fr 1fr; gap:12px; width:100%; max-width:420px; }
  .levelCard { position:relative; background:linear-gradient(160deg, rgba(60,45,90,0.55), rgba(24,18,40,0.7)); border:1.5px solid rgba(232,184,109,0.35); border-radius:14px; padding:14px 10px; text-align:center; cursor:pointer; transition:transform 0.15s; }
  .levelCard:active { transform:scale(0.96); }
  .levelCard.locked { opacity:0.4; filter:grayscale(0.6); cursor:default; }
  .levelCard.current { border-color:#e8b86d; box-shadow:0 0 14px rgba(232,184,109,0.35); }
  .levelNum { font-size:11px; color:#e8b86d; letter-spacing:1px; margin-bottom:4px; }
  .levelName { font-size:12px; color:#fdf3e2; line-height:1.3; font-weight:600; }
  .levelDesc { font-size:10px; color:#a89bc9; line-height:1.25; margin-top:3px; }
  .levelIcon { font-size:20px; margin-bottom:4px; }
  .lockIcon { position:absolute; top:8px; right:10px; font-size:13px; opacity:0.8; }
  .doneIcon { position:absolute; top:8px; right:10px; font-size:13px; color:#7fd4c1; }
  #resetProgress { margin-top:24px; background:none; border:1px solid rgba(200,150,150,0.3); color:#c9a8a0; font-size:11px; padding:7px 16px; border-radius:20px; }

  #levelFrame { position:fixed; inset:0; z-index:20; display:none; }
  #levelFrame.active { display:block; }
  #levelFrame iframe { width:100%; height:100%; border:none; }

  /* small always-present back icon during gameplay — bottom-left corner, out of the way of HUD/controls */
  #backIcon { position:fixed; left:max(10px, env(safe-area-inset-left)); bottom:calc(75px + env(safe-area-inset-bottom)); z-index:26; width:38px; height:38px; border-radius:50%; background:rgba(20,14,30,0.55); border:1px solid rgba(232,184,109,0.35); color:#e8b86d; padding:0; display:none; align-items:center; justify-content:center; }
  #backIcon.show { display:flex; }

  /* small, edge-anchored bar — appears only after a level is won, never covers the level's own win screen or message */
  #postWinBar { position:fixed; left:0; right:0; bottom:0; z-index:25; display:none; flex-direction:column; align-items:center; gap:10px; padding:14px max(10px, env(safe-area-inset-left)) calc(14px + env(safe-area-inset-bottom)); background:rgb(10,8,16); }
  #postWinBar.show { display:flex; }
  #postWinBar .row { display:flex; gap:10px; justify-content:center; }
  #postWinBar button { pointer-events:auto; background:rgba(232,184,109,0.92); color:#2a1f14; border:none; border-radius:18px; padding:9px 18px; font-size:13px; font-weight:600; }
  #postWinBar button.secondary { background:rgba(20,14,30,0.75); border:1px solid rgba(232,184,109,0.5); color:#e8b86d; }

  /* custom confirm modal — native confirm() is unreliable in many in-app/WebView browsers */
  #confirmModal { position:fixed; inset:0; z-index:40; background:rgba(8,6,12,0.85); display:none; align-items:center; justify-content:center; padding:0 30px; }
  #confirmModal.show { display:flex; }
  #confirmModal .box { background:linear-gradient(160deg, rgba(50,38,70,0.98), rgba(20,14,30,0.98)); border:1.5px solid rgba(232,184,109,0.4); border-radius:16px; padding:24px 22px; text-align:center; max-width:320px; }
  #confirmModal .box p { color:#fdf3e2; font-size:15px; line-height:1.5; margin:0 0 18px; }
  #confirmModal .box .row { display:flex; gap:10px; justify-content:center; }
  #confirmModal .box button { border:none; border-radius:18px; padding:9px 20px; font-size:13px; font-weight:600; }
  #confirmModal .box #confirmYes { background:#e8b86d; color:#2a1f14; }
  #confirmModal .box #confirmNo { background:rgba(255,255,255,0.08); color:#d8cfe8; }
</style>
</head>
<body>

<div id="confirmModal">
  <div class="box">
    <p id="confirmText"></p>
    <div class="row">
      <button id="confirmYes">Yes</button>
      <button id="confirmNo">Cancel</button>
    </div>
  </div>
</div>

<div id="hub">
  <div class="hubTitle">SAFY <span class="hubHeart">♥</span> OR NOTHING</div>
  <div class="hubSub">Riyadh to Qena. Ten stretches of road. One reason to keep going.</div>
  <div class="levelGrid" id="levelGrid"></div>
  <button id="resetProgress">Reset progress</button>
</div>

<div id="levelFrame"><iframe id="gameIframe" title="level"></iframe></div>
<button id="backIcon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg></button>

<div id="postWinBar">
  <div class="row">
    <button id="nextLevelBtn">Next Level →</button>
    <button class="secondary" id="toHubBtn">☰ Levels</button>
    <button id="startOverBtn" style="display:none;">Start Over</button>
  </div>
</div>

<button id="journeySaveError" hidden style="position:fixed;top:0;left:0;right:0;z-index:60;background:#5a2930;color:white;padding:12px;border:0" onclick="window.flushJourney().catch(()=>{})"></button>
<script>

const journeyInitial = __JOURNEY_PROGRESS__;
let journeyRevision=journeyInitial.revision, journeyDirty=false, journeyTimer, journeySaving=null;
const journeyValues={safyUnlockedLevel:String(journeyInitial.unlocked),safyCurrentLevel:journeyInitial.current===null?null:String(journeyInitial.current),safyAllComplete:journeyInitial.complete?'1':null};
const journeyStorage={getItem:k=>journeyValues[k]??null,setItem(k,v){journeyValues[k]=String(v);scheduleJourney();},removeItem(k){delete journeyValues[k];scheduleJourney();}};
function scheduleJourney(){journeyDirty=true;clearTimeout(journeyTimer);journeyTimer=setTimeout(()=>window.flushJourney().catch(()=>{}),100);}
window.flushJourney=async function(){
 clearTimeout(journeyTimer);
 if(journeySaving)await journeySaving;
 if(!journeyDirty)return;
 const data={revision:journeyRevision,unlocked:Number(journeyValues.safyUnlockedLevel||1),current:journeyValues.safyCurrentLevel?Number(journeyValues.safyCurrentLevel):null,complete:journeyValues.safyAllComplete==='1'};
 journeyDirty=false;
 journeySaving=(async()=>{try{
 const r=await fetch('/api/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:crypto.randomUUID(),type:'journey.save',data}),signal:AbortSignal.timeout(15000)});
 const value=await r.json();if(!r.ok)throw Error(value.error||'Could not save progress.');journeyRevision=value.revision;
 document.getElementById('journeySaveError').hidden=true;
 }catch(e){journeyDirty=true;const n=document.getElementById('journeySaveError');n.textContent=e.message+' Tap to retry.';n.hidden=false;throw e;}finally{journeySaving=null;}})();
 await journeySaving;if(journeyDirty)await window.flushJourney();
};
window.addEventListener('online',()=>window.flushJourney().catch(()=>{}));

<script>
const LEVEL_ICONS = ['🏠','✈️','🛫','🏙️','🏃','🚂','🌊','🏛️','🌾','🌉'];
const STORAGE_UNLOCKED = 'safyUnlockedLevel';
const STORAGE_CURRENT = 'safyCurrentLevel';
const STORAGE_ALLDONE = 'safyAllComplete';

function getUnlocked() {
  const v = parseInt(journeyStorage.getItem(STORAGE_UNLOCKED) || '1', 10);
  return isNaN(v) ? 1 : Math.max(1, Math.min(10, v));
}
function setUnlocked(n) {
  const cur = getUnlocked();
  if (n > cur) journeyStorage.setItem(STORAGE_UNLOCKED, String(Math.min(10, n)));
}
function getCurrent() {
  const v = journeyStorage.getItem(STORAGE_CURRENT);
  return v ? parseInt(v, 10) : null;
}
function setCurrent(n) {
  if (n === null) journeyStorage.removeItem(STORAGE_CURRENT);
  else journeyStorage.setItem(STORAGE_CURRENT, String(n));
}
function isAllComplete() {
  return journeyStorage.getItem(STORAGE_ALLDONE) === '1';
}
function setAllComplete() {
  journeyStorage.setItem(STORAGE_ALLDONE, '1');
}

// reliable custom confirm — native confirm() is blocked/unreliable in many in-app browsers
function showConfirm(message) {
  return new Promise((resolve) => {
    document.getElementById('confirmText').textContent = message;
    const modal = document.getElementById('confirmModal');
    modal.classList.add('show');
    const yesBtn = document.getElementById('confirmYes');
    const noBtn = document.getElementById('confirmNo');
    function cleanup(result) {
      modal.classList.remove('show');
      yesBtn.removeEventListener('click', onYes);
      noBtn.removeEventListener('click', onNo);
      resolve(result);
    }
    function onYes() { cleanup(true); }
    function onNo() { cleanup(false); }
    yesBtn.addEventListener('click', onYes);
    noBtn.addEventListener('click', onNo);
  });
}

function decodeLevel(n) {
  const b64 = LEVEL_DATA[n - 1];
  const binStr = atob(b64);
  const bytes = new Uint8Array(binStr.length);
  for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

function renderHub() {
  const unlocked = getUnlocked();
  const grid = document.getElementById('levelGrid');
  grid.innerHTML = '';
  for (let i = 1; i <= 10; i++) {
    const card = document.createElement('div');
    const isLocked = i > unlocked;
    const isDone = i < unlocked;
    card.className = 'levelCard' + (isLocked ? ' locked' : '') + (i === unlocked ? ' current' : '');
    card.innerHTML = `
      <div class="levelIcon">${LEVEL_ICONS[i-1]}</div>
      <div class="levelNum">LEVEL ${String(i).padStart(2,'0')}</div>
      <div class="levelName">${LEVEL_TITLES[i-1]}</div>
      <div class="levelDesc">${LEVEL_DESCS[i-1]}</div>
      ${isLocked ? '<div class="lockIcon">🔒</div>' : ''}
      ${isDone ? '<div class="doneIcon">✓</div>' : ''}
    `;
    if (!isLocked) card.addEventListener('click', () => launchLevel(i));
    grid.appendChild(card);
  }
  document.getElementById('hub').classList.remove('hidden');
  document.getElementById('levelFrame').classList.remove('active');
  document.getElementById('postWinBar').classList.remove('show');
  document.getElementById('backIcon').classList.remove('show');
  document.getElementById('resetProgress').style.display = isAllComplete() ? '' : 'none';
}

function launchLevel(n) {
  setCurrent(n);
  const iframe = document.getElementById('gameIframe');
  iframe.srcdoc = decodeLevel(n);
  document.getElementById('hub').classList.add('hidden');
  document.getElementById('levelFrame').classList.add('active');
  document.getElementById('postWinBar').classList.remove('show');
  document.getElementById('backIcon').classList.add('show');
}

// small edge bar only — never covers the level's own win screen or message
function showPostWinBar(n) {
  const isLast = n >= 10;
  document.getElementById('nextLevelBtn').style.display = isLast ? 'none' : '';
  document.getElementById('startOverBtn').style.display = isLast ? '' : 'none';
  document.getElementById('toHubBtn').textContent = isLast ? 'Choose a Level' : '☰ Levels';
  document.getElementById('postWinBar').classList.add('show');
  document.getElementById('backIcon').classList.remove('show');
}

document.getElementById('startOverBtn').addEventListener('click', async () => {
  const ok = await showConfirm('Start over from Level 1? This locks every level again.');
  if (ok) {
    journeyStorage.removeItem(STORAGE_UNLOCKED);
    journeyStorage.removeItem(STORAGE_CURRENT);
    journeyStorage.removeItem(STORAGE_ALLDONE);
    document.getElementById('gameIframe').srcdoc = '';
    renderHub();
  }
});

document.getElementById('backIcon').addEventListener('click', () => {
  setCurrent(null);
  document.getElementById('gameIframe').srcdoc = '';
  renderHub();
});

document.getElementById('nextLevelBtn').addEventListener('click', () => {
  const cur = getCurrent();
  const next = (cur || 1) + 1;
  launchLevel(next);
});

document.getElementById('toHubBtn').addEventListener('click', () => {
  setCurrent(null);
  document.getElementById('gameIframe').srcdoc = '';
  renderHub();
});

document.getElementById('resetProgress').addEventListener('click', async () => {
  const ok = await showConfirm('Reset all level progress?');
  if (ok) {
    journeyStorage.removeItem(STORAGE_UNLOCKED);
    journeyStorage.removeItem(STORAGE_CURRENT);
    journeyStorage.removeItem(STORAGE_ALLDONE);
    renderHub();
  }
});

window.addEventListener('message', (e) => {
  if (e.source === document.getElementById('gameIframe').contentWindow && e.data && e.data.type === 'safyLevelComplete' && Number.isInteger(e.data.level) && e.data.level === getCurrent()) {
    const n = e.data.level;
    setUnlocked(n + 1);
    if (n >= 10) setAllComplete();
    showPostWinBar(n);
  }
});

// on load: if a level was in progress, jump straight back into it (same rules as any other attempt)
(function init() {
  const cur = getCurrent();
  if (cur && cur >= 1 && cur <= 10 && cur <= getUnlocked()) {
    launchLevel(cur);
  } else {
    renderHub();
  }
})();

</script>
</body>
</html>
