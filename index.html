<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mahmoud ♥ Safy</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f5f7fb;font-family:Arial,Tahoma,sans-serif}button,input{font:inherit}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(420px,100%);background:#11151d;border:1px solid #29303d;border-radius:22px;padding:22px}h1{text-align:center;font-size:23px}h1 b{color:#ff4f73}.sub{text-align:center;color:#929bad;font-size:12px}label{display:block;color:#929bad;font-size:12px;margin:14px 0 6px}input{width:100%;min-height:48px;border:1px solid #29303d;background:#0d1118;color:white;border-radius:14px;padding:11px;font-size:16px}.primary{width:100%;min-height:48px;margin-top:16px;border:0;border-radius:14px;background:#ff4f73;color:white;font-weight:bold}.err{color:#ff8ba0;font-size:12px;text-align:center;margin-top:10px}.app{width:min(720px,100%);height:100dvh;margin:auto;padding:16px 14px 0;display:flex;flex-direction:column;overflow:hidden}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #29303d;padding-bottom:14px}.status{color:#68d497;font-size:11px}.small{border:1px solid #29303d;background:#11151d;color:white;border-radius:10px;padding:8px}.tools{display:flex;gap:7px;overflow:auto;padding:13px 0}.tool{white-space:nowrap;min-height:42px;border:1px solid #29303d;background:#11151d;color:white;border-radius:12px;padding:8px 11px}#chat{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth;padding:6px 0 12px;scrollbar-width:none}#chat::-webkit-scrollbar{display:none}.msg{display:flex;gap:8px;margin:14px 0;align-items:end}.mine{flex-direction:row-reverse}.av{width:34px;height:34px;border-radius:50%;background:#171c26;display:grid;place-items:center;font-weight:bold}.mb{max-width:80%}.who{font-size:10px;color:#929bad;margin:0 5px 4px}.bubble{background:#171c26;border:1px solid #29303d;padding:11px 13px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere}.mine .bubble{background:#2a1720}.composer{flex:none;width:100%;padding:8px 0 max(12px,env(safe-area-inset-bottom));background:#090b10}.box{display:flex;gap:7px;background:#11151d;border:1px solid #29303d;border-radius:17px;padding:6px}.box input{border:0;background:transparent}.send{width:48px;border:0;border-radius:13px;background:#ff4f73;color:white;font-size:20px}
</style></head><body>
<div id="login" class="login"><form id="lf" class="card"><h1>MAHMOUD <b>♥</b> SAFY</h1><div id="sub" class="sub">Our private space</div><label id="el">Email</label><input id="email" type="email" required autocomplete="username"><label id="pl">Password</label><input id="pass" type="password" required autocomplete="current-password"><button id="lb" class="primary">Sign in</button><div id="err" class="err"></div></form></div>
<div id="main" class="hide"><div class="app"><header><div><strong>MAHMOUD <span style="color:#ff4f73">♥</span> SAFY</strong><div id="status" class="status">● Connected</div></div><div><button id="lang" class="small">🌐 EN</button> <button id="out" class="small">Logout</button></div></header><div class="tools"><button class="tool">⚖️ Judge</button><button class="tool">🎮 Game</button><button class="tool">🗳️ Vote</button><button class="tool">🎲 Activity</button><button class="tool">🎨 Create</button><button class="tool">❤️ Plan</button></div><div id="chat"></div><form id="mf" class="composer"><div class="box"><input id="mi" placeholder="Write a message..." autocomplete="off"><button class="send">↑</button></div></form></div></div>
<script type="module">
const URL='https://oiwxwogdfjgrapigiqrw.supabase.co',KEY='sb_publishable_lMznjYUYssuAuNJ6k5bnRg_oZ-T-kfZ',ROOM='MAHMOUD-SAFY';let sb,user,room,ch,ar=false;
const $=s=>document.querySelector(s);
function ui(){document.documentElement.dir=ar?'rtl':'ltr';$('#sub').textContent=ar?'مساحتنا الخاصة':'Our private space';$('#el').textContent=ar?'البريد الإلكتروني':'Email';$('#pl').textContent=ar?'كلمة المرور':'Password';$('#lb').textContent=ar?'دخول':'Sign in';$('#out').textContent=ar?'خروج':'Logout';$('#lang').textContent=ar?'🌐 AR':'🌐 EN';$('#mi').placeholder=ar?'اكتب رسالة...':'Write a message...'}
function add(m){if(document.querySelector('[data-id="'+m.id+'"]'))return;let mine=user&&m.sender===user.id,d=document.createElement('div'),n=m.sender_name||'User';d.className='msg '+(mine?'mine':'');d.dataset.id=m.id;d.innerHTML='<div class="av"></div><div class="mb"><div class="who"></div><div class="bubble"></div></div>';d.querySelector('.av').textContent=n[0].toUpperCase();d.querySelector('.who').textContent=n;d.querySelector('.bubble').textContent=m.content||'';$('#chat').appendChild(d);requestAnimationFrame(()=>{$('#chat').scrollTo({top:$('#chat').scrollHeight,behavior:'smooth'})})}
async function enter(u){user=u;let r=await sb.from('rooms').select('*').eq('room_code',ROOM).single();if(r.error){$('#err').textContent=r.error.message;return}room=r.data;$('#login').classList.add('hide');$('#main').classList.remove('hide');let ms=await sb.from('messages').select('*').eq('room_id',room.id).order('created_at').limit(200);$('#chat').innerHTML='';if(!ms.error)ms.data.forEach(add);requestAnimationFrame(()=>{$('#chat').scrollTop=$('#chat').scrollHeight});ch=sb.channel('room').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'room_id=eq.'+room.id},p=>add(p.new)).subscribe()}
try{let mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=mod.createClient(URL,KEY);let s=await sb.auth.getSession();if(s.data.session)await enter(s.data.session.user)}catch(e){$('#err').textContent='Connection error: '+e.message}
$('#lf').addEventListener('submit',async e=>{e.preventDefault();$('#err').textContent='';let r=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pass').value});if(r.error)$('#err').textContent=r.error.message;else await enter(r.data.user)});
$('#mf').addEventListener('submit',async e=>{e.preventDefault();let t=$('#mi').value.trim();if(!t)return;$('#mi').value='';let name=(user.email||'User').split('@')[0];let r=await sb.from('messages').insert({room_id:room.id,sender:user.id,sender_name:name,content:t}).select().single();if(r.error)alert(r.error.message);else add(r.data)});
$('#out').addEventListener('click',async()=>{if(ch)await sb.removeChannel(ch);await sb.auth.signOut();location.reload()});
$('#lang').addEventListener('click',()=>{ar=!ar;ui()});
window.addEventListener('offline',()=>setStatus(lang==='ar'?'غير متصل':'Offline',0));
window.addEventListener('online',()=>setStatus(lang==='ar'?'جارٍ إعادة الاتصال...':'Reconnecting…',0));
$('#mi').addEventListener('focus',()=>setTimeout(()=>{$('#chat').scrollTop=$('#chat').scrollHeight},250));
window.visualViewport?.addEventListener('resize',()=>{if(document.activeElement===$('#mi'))requestAnimationFrame(()=>{$('#chat').scrollTop=$('#chat').scrollHeight})});
document.querySelectorAll('.tool').forEach(b=>b.addEventListener('click',()=>alert(ar?'أدوات الـAI هنفعلها في المرحلة التالية.':'AI tools will be activated in the next stage.')));ui();
</script></body></html>
