<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mahmoud Safy</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui;background:#0b0b0f;color:#fff}.hide{display:none!important}.login{min-height:100dvh;display:grid;place-items:center;padding:24px}.card{width:min(430px,100%);background:#15151b;border:1px solid #292932;border-radius:24px;padding:24px}.field{width:100%;margin-top:14px;padding:14px;border-radius:14px;border:1px solid #30303a;background:#0e0e13;color:#fff}.primary{width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;font-weight:800}.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.top{padding:12px;border-bottom:1px solid #222}.row{display:flex;gap:8px;align-items:center}.title{font-weight:800;flex:1}.tools{display:flex;gap:7px;overflow:auto;padding-top:9px}.tool,.small{border:1px solid #30303a;background:#17171d;color:#fff;border-radius:999px;padding:8px 11px;white-space:nowrap}.chat{flex:1;min-height:0;overflow-y:auto;padding:14px;scroll-behavior:smooth}.msg{display:flex;gap:8px;margin:10px 0;align-items:flex-end}.msg.me{justify-content:flex-end}.avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#292933}.bubble{max-width:78%;padding:10px 13px;border-radius:17px;background:#1b1b22;white-space:pre-wrap;overflow-wrap:anywhere}.me .bubble{background:#eee;color:#111}.ai .avatar{background:#6f5cff}.ai .bubble{background:#181522;border:1px solid #352d55}.who{font-size:11px;opacity:.6;margin-bottom:3px}.composer{display:flex;gap:8px;padding:9px 10px calc(9px + env(safe-area-inset-bottom));border-top:1px solid #222}.composer textarea{flex:1;resize:none;min-height:44px;max-height:120px;border:1px solid #30303a;background:#17171d;color:#fff;border-radius:16px;padding:11px}.send{width:46px;border:0;border-radius:14px;font-size:20px}.status{font-size:12px;color:#aaa}</style></head><body>
<section id="login" class="login"><form id="lf" class="card"><h1>Mahmoud Safy</h1><div>Our private room.</div><input id="email" class="field" type="email" placeholder="Email" required><input id="pass" class="field" type="password" placeholder="Password" required><button class="primary">Enter room</button><div id="err"></div></form></section>
<section id="main" class="app hide"><header class="top"><div class="row"><div class="title">Mahmoud × Safy</div><span id="st" class="status">Connecting…</span><button id="lang" class="small">AR</button><button id="out" class="small">Logout</button></div><div class="tools"><button class="tool" data-mode="Judge">⚖ Judge</button><button class="tool" data-mode="Game">🎮 Game</button><button class="tool" data-mode="Vote">🗳 Vote</button><button class="tool" data-mode="Activity">✨ Activity</button><button class="tool" data-mode="Plan">🗓 Plan</button></div></header><main id="chat" class="chat"></main><form id="mf" class="composer"><textarea id="mi" rows="1" placeholder="Message Mahmoud & Safy…"></textarea><button class="send">↑</button></form></section>
<script type="module">
const URL='https://oiwxwogdfjgrapigiqrw.supabase.co',KEY='sb_publishable_lMznjYUYssuAuNJ6k5bnRg_oZ-T-kfZ',ROOM='MAHMOUD-SAFY',FN='mahmoud-safy-ai';
const $=s=>document.querySelector(s);let sb,user,room,ch,lang=localStorage.getItem('ms_lang')||'en';const seen=new Set();
function ui(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('#lang').textContent=lang==='ar'?'EN':'AR';$('#mi').placeholder=lang==='ar'?'اكتب رسالة لمحمود وصافي…':'Message Mahmoud & Safy…'}
function name(){let n=user?.user_metadata?.display_name||user?.user_metadata?.name;if(n)return n;let p=(user?.email||'').split('@')[0].toLowerCase();return p.includes('safy')?'Safy':p.includes('mahm')?'Mahmoud':p||'Me'}
function bottom(){requestAnimationFrame(()=>$('#chat').scrollTop=$('#chat').scrollHeight)}
function add(m,ai=false){if(m.id&&seen.has(m.id))return;if(m.id)seen.add(m.id);let mine=!ai&&m.sender===user?.id,r=document.createElement('div');r.className='msg '+(mine?'me':ai?'ai':'');let me=name(),other=me==='Mahmoud'?'Safy':me==='Safy'?'Mahmoud':(m.sender_name||'User'),n=ai?'AI':mine?me:other;r.innerHTML=(mine?'':'<div class="avatar">'+(ai?'✦':(n[0]||'?'))+'</div>')+'<div class="bubble" dir="auto"><div class="who"></div><div class="content"></div></div>';r.querySelector('.who').textContent=n;r.querySelector('.content').textContent=m.content||'';$('#chat').append(r);bottom()}
function aiText(data){if(!data)return'';if(typeof data==='string')return data;for(const k of ['reply','output_text','message','text'])if(typeof data[k]==='string'&&data[k].trim())return data[k].trim();if(Array.isArray(data.output))for(const item of data.output||[])for(const c of item?.content||[])if((c?.type==='output_text'||c?.type==='text')&&typeof c.text==='string')return c.text.trim();return''}
async function askAI(message,mode='Chat'){let thinking=lang==='ar'?'بيفكر…':'Thinking…',tmp='tmp'+Date.now();add({id:tmp,content:thinking},true);try{let {data,error}=await sb.functions.invoke(FN,{body:{message,mode,room_id:room.id,language:lang}});document.querySelectorAll('.msg').forEach(x=>{if(x.textContent.includes(thinking))x.remove()});seen.delete(tmp);if(error)throw error;let reply=aiText(data);if(!reply)throw Error(data?.error||'AI returned no text');add({content:reply},true)}catch(e){document.querySelectorAll('.msg').forEach(x=>{if(x.textContent.includes(thinking))x.remove()});seen.delete(tmp);add({content:(lang==='ar'?'تعذر الاتصال بالـ AI: ':'AI connection failed: ')+(e.message||e)},true)}}
async function enter(u){user=u;$('#login').classList.add('hide');$('#main').classList.remove('hide');let {data:r,error}=await sb.from('rooms').select('*').eq('room_code',ROOM).single();if(error)throw error;room=r;let q=await sb.from('messages').select('*').eq('room_id',room.id).order('created_at',{ascending:true});if(q.error)throw q.error;$('#chat').innerHTML='';seen.clear();(q.data||[]).forEach(add);bottom();if(ch)await sb.removeChannel(ch);ch=sb.channel('room-'+room.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'room_id=eq.'+room.id},p=>add(p.new)).subscribe(s=>$('#st').textContent=s==='SUBSCRIBED'?(lang==='ar'?'متصل':'Connected'):(lang==='ar'?'جاري الاتصال…':'Connecting…'))}
async function boot(){ui();let mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=mod.createClient(URL,KEY);let {data:{session}}=await sb.auth.getSession();if(session?.user)try{await enter(session.user)}catch(e){$('#err').textContent=e.message}}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';let {data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pass').value});if(error)return $('#err').textContent=error.message;try{await enter(data.user)}catch(x){$('#err').textContent=x.message}};
$('#mf').onsubmit=async e=>{e.preventDefault();let text=$('#mi').value.trim();if(!text||!room)return;$('#mi').value='';let {error}=await sb.from('messages').insert({room_id:room.id,sender:user.id,sender_name:name(),content:text});if(error)return add({sender_name:'System',content:'Send failed: '+error.message});if(/(^|\s)(@ai|ai\b|الذكاء|يا ai|يا ذكاء)/i.test(text))await askAI(text)};
$('#out').onclick=async()=>{if(ch)await sb.removeChannel(ch);await sb.auth.signOut();location.reload()};$('#lang').onclick=()=>{lang=lang==='en'?'ar':'en';localStorage.setItem('ms_lang',lang);ui()};$('#mi').oninput=e=>{e.target.style.height='44px';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px'};
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>askAI(lang==='ar'?`ابدأ لنا ${b.dataset.mode} مناسب لمحمود وصافي الآن.`:`Start a ${b.dataset.mode} for Mahmoud and Safy now.`,b.dataset.mode));
window.visualViewport?.addEventListener('resize',bottom);boot();
</script></body></html>
