<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mahmoud × Safy</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#09090d;color:#fff}.hide{display:none!important}button,textarea,input{font:inherit}.login{min-height:100dvh;display:grid;place-items:center;padding:24px}.loginCard{width:min(430px,100%);background:#14141b;border:1px solid #292934;border-radius:26px;padding:24px}.field{width:100%;margin-top:13px;padding:14px;border-radius:15px;border:1px solid #30303c;background:#0d0d12;color:#fff}.primary{width:100%;margin-top:16px;padding:14px;border:0;border-radius:15px;font-weight:800}.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.top{padding:11px 12px 8px;border-bottom:1px solid #23232c;background:#0c0c11;z-index:5}.row{display:flex;gap:8px;align-items:center}.title{font-weight:850;font-size:19px;flex:1}.status{font-size:12px;color:#9b9ba8}.small,.tool{border:1px solid #30303b;background:#17171e;color:#fff;border-radius:999px;white-space:nowrap}.small{padding:8px 11px}.tools{display:flex;gap:7px;overflow-x:auto;padding-top:9px;scrollbar-width:none}.tools::-webkit-scrollbar{display:none}.tool{padding:9px 12px}.chat{flex:1;min-height:0;overflow-y:auto;padding:14px;scroll-behavior:smooth}.msg{display:flex;gap:8px;margin:10px 0;align-items:flex-end}.msg.me{justify-content:flex-end}.avatar{width:31px;height:31px;flex:0 0 31px;border-radius:50%;display:grid;place-items:center;background:#2a2a35;font-weight:800}.bubble{max-width:min(82%,560px);padding:10px 13px;border-radius:18px;background:#1b1b23;overflow-wrap:anywhere}.me .bubble{background:#f1f1f3;color:#111}.ai .avatar{background:#6d58ff}.ai .bubble{background:#181522;border:1px solid #3a3060}.who{font-size:11px;opacity:.58;margin-bottom:4px}.content{white-space:pre-wrap;line-height:1.45}.aiActions{display:flex;gap:8px;margin-top:8px}.mini{border:0;background:transparent;color:#a99cff;padding:2px 0;font-size:12px}.thinking .content{opacity:.65}.activity{margin:12px auto;width:min(94%,560px);background:linear-gradient(180deg,#171522,#121219);border:1px solid #3a315b;border-radius:22px;padding:16px;box-shadow:0 12px 35px #0005}.actTag{font-size:11px;color:#a99cff;text-transform:uppercase;letter-spacing:.08em}.actTitle{font-weight:850;font-size:18px;margin:5px 0}.actQ{line-height:1.45;margin:8px 0 13px}.options{display:grid;gap:8px}.option{border:1px solid #393444;background:#1c1a24;color:#fff;border-radius:14px;padding:12px;text-align:start}.option:disabled{opacity:.55}.wait{font-size:12px;color:#aaa;margin-top:10px}.answers{margin-top:12px;padding-top:10px;border-top:1px solid #302b42;display:grid;gap:6px}.answer{font-size:13px;background:#0f0e15;border-radius:11px;padding:8px}.composerWrap{position:relative;border-top:1px solid #23232c;background:#0c0c11}.mention{position:absolute;left:12px;right:12px;bottom:72px;background:#191921;border:1px solid #383844;border-radius:16px;padding:7px;box-shadow:0 15px 40px #0008}.mention button{width:100%;border:0;background:#252334;color:#fff;border-radius:12px;padding:12px;text-align:start;font-weight:750}.composer{display:flex;gap:8px;padding:9px 10px calc(9px + env(safe-area-inset-bottom))}.composer textarea{flex:1;resize:none;min-height:46px;max-height:120px;border:1px solid #30303b;background:#17171e;color:#fff;border-radius:17px;padding:12px}.send{width:48px;border:0;border-radius:15px;font-size:20px}.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:#25252e;border:1px solid #3a3a45;padding:9px 13px;border-radius:999px;font-size:13px;z-index:20}
</style></head><body>
<section id="login" class="login"><form id="lf" class="loginCard"><h1>Mahmoud × Safy</h1><div>Our private room.</div><input id="email" class="field" type="email" placeholder="Email" required><input id="pass" class="field" type="password" placeholder="Password" required><button class="primary">Enter room</button><div id="err"></div></form></section>
<section id="main" class="app hide"><header class="top"><div class="row"><div class="title">Mahmoud × Safy</div><span id="st" class="status">Connecting…</span><button id="lang" class="small">AR</button><button id="out" class="small">Logout</button></div><div class="tools"><button class="tool" data-mode="Game">🎮 Game</button><button class="tool" data-mode="Vote">🗳 Vote</button><button class="tool" data-mode="Activity">✨ Activity</button><button class="tool" data-mode="Judge">⚖ Judge</button><button class="tool" data-mode="Plan">🗓 Plan</button></div></header><main id="chat" class="chat"></main><div class="composerWrap"><div id="mention" class="mention hide"><button id="pickAI">✦ AI <span style="opacity:.55;font-weight:400">— ask our third friend</span></button></div><form id="mf" class="composer"><textarea id="mi" rows="1" placeholder="Message Mahmoud & Safy…"></textarea><button class="send">↑</button></form></div></section>
<script type="module">
const URL='https://oiwxwogdfjgrapigiqrw.supabase.co',KEY='sb_publishable_lMznjYUYssuAuNJ6k5bnRg_oZ-T-kfZ',ROOM='MAHMOUD-SAFY',FN='mahmoud-safy-ai';
const $=s=>document.querySelector(s);let sb,user,room,msgCh,actCh,resCh,lang=localStorage.getItem('ms_lang')||'en';const seenMsg=new Set(),seenAct=new Set(),activityEls=new Map();
function myName(){let n=user?.user_metadata?.display_name||user?.user_metadata?.name;if(n)return n;let p=(user?.email||'').split('@')[0].toLowerCase();return p.includes('safy')?'Safy':p.includes('mahm')?'Mahmoud':p||'Me'}
function ui(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('#lang').textContent=lang==='ar'?'EN':'AR';$('#mi').placeholder=lang==='ar'?'اكتب لمحمود وصافي… واكتب @ لاستدعاء AI':'Message Mahmoud & Safy… type @ for AI'}
function bottom(){requestAnimationFrame(()=>$('#chat').scrollTop=$('#chat').scrollHeight)}
function isAI(m){return m.message_type==='ai'||m.sender==='ai'||m.sender_name==='AI'}
function renderMessage(m){if(m.id&&seenMsg.has(m.id))return;if(m.id)seenMsg.add(m.id);let ai=isAI(m),mine=!ai&&m.sender===user?.id,r=document.createElement('div');r.className='msg '+(mine?'me':ai?'ai':'');let n=ai?'AI':(m.sender_name|| (mine?myName():'User'));r.dataset.id=m.id||'';r.innerHTML=(mine?'':'<div class="avatar">'+(ai?'✦':(n[0]||'?'))+'</div>')+'<div class="bubble" dir="auto"><div class="who"></div><div class="content"></div></div>';r.querySelector('.who').textContent=n;r.querySelector('.content').textContent=m.content||'';if(ai&&m.content){let a=document.createElement('div');a.className='aiActions';let b=document.createElement('button');b.className='mini';b.textContent='🌐 '+(lang==='ar'?'ترجمة':'Translate');b.onclick=()=>translateBubble(b,r.querySelector('.content'),m.content);a.append(b);r.querySelector('.bubble').append(a)}$('#chat').append(r);bottom()}
function thinking(on=true){let old=$('#aiThinking');if(old)old.remove();if(!on)return;let r=document.createElement('div');r.id='aiThinking';r.className='msg ai thinking';r.innerHTML='<div class="avatar">✦</div><div class="bubble"><div class="who">AI</div><div class="content">'+(lang==='ar'?'بيفكر…':'Thinking…')+'</div></div>';$('#chat').append(r);bottom()}
async function recentContext(){let {data}=await sb.from('messages').select('sender_name,message_type,content,created_at').eq('room_id',room.id).order('created_at',{ascending:false}).limit(24);return (data||[]).reverse()}
async function callAI(message,mode='Chat',extra={}){thinking(true);try{let context=await recentContext(),{data,error}=await sb.functions.invoke(FN,{body:{message,mode,language:lang,context,...extra}});if(error)throw error;if(data?.error)throw Error(data.error);let reply=(data?.reply||'').trim();if(reply){let ins=await sb.from('messages').insert({room_id:room.id,sender:'ai',sender_name:'AI',message_type:'ai',content:reply,metadata:{mode,model:data?.model||null}});if(ins.error)throw ins.error}if(data?.activity)await createActivity(data.activity,mode)}catch(e){toast((lang==='ar'?'مشكلة في AI: ':'AI problem: ')+(e.message||e))}finally{thinking(false)}}
async function translateBubble(btn,el,original){if(btn.dataset.translated==='1'){el.textContent=original;btn.textContent='🌐 '+(lang==='ar'?'ترجمة':'Translate');btn.dataset.translated='0';return}btn.disabled=true;try{let {data,error}=await sb.functions.invoke(FN,{body:{action:'translate',message:original,language:lang}});if(error)throw error;el.textContent=data?.reply||original;btn.textContent=lang==='ar'?'↩ النص الأصلي':'↩ Show original';btn.dataset.translated='1'}catch(e){toast(e.message||'Translate failed')}finally{btn.disabled=false}}
async function createActivity(a,mode){if(!a?.question)return;let type=a.type||mode.toLowerCase(),data={options:Array.isArray(a.options)?a.options:[],secret:a.secret!==false,instructions:a.instructions||'',source:'ai'};let {error}=await sb.from('activities').insert({room_id:room.id,created_by:'ai',activity_type:type,title:a.title||mode,question:a.question,data,status:'active'});if(error)throw error}
async function renderActivity(a){if(a.id&&seenAct.has(a.id))return;if(a.id)seenAct.add(a.id);let r=document.createElement('section');r.className='activity';r.dataset.activity=a.id;r.innerHTML='<div class="actTag"></div><div class="actTitle"></div><div class="actQ" dir="auto"></div><div class="options"></div><div class="wait"></div><div class="answers hide"></div>';r.querySelector('.actTag').textContent=a.activity_type||'Activity';r.querySelector('.actTitle').textContent=a.title||'AI Activity';r.querySelector('.actQ').textContent=a.question||'';let opts=a.data?.options||[],box=r.querySelector('.options');if(opts.length){opts.forEach(o=>{let b=document.createElement('button');b.className='option';b.textContent=o;b.onclick=()=>answerActivity(a,o);box.append(b)})}else{let inp=document.createElement('textarea');inp.className='field';inp.placeholder=lang==='ar'?'إجابتك…':'Your answer…';let b=document.createElement('button');b.className='option';b.textContent=lang==='ar'?'إرسال الإجابة':'Submit answer';b.onclick=()=>{let v=inp.value.trim();if(v)answerActivity(a,v)};box.append(inp,b)}$('#chat').append(r);activityEls.set(a.id,r);await refreshActivity(a.id,a);bottom()}
async function answerActivity(a,answer){let {data:old}=await sb.from('activity_responses').select('id').eq('activity_id',a.id).eq('sender',user.id).limit(1);if(old?.length)return toast(lang==='ar'?'إجابتك اتسجلت بالفعل ✓':'Your answer is already locked ✓');let {error}=await sb.from('activity_responses').insert({activity_id:a.id,sender:user.id,response:{answer,name:myName()}});if(error)return toast(error.message);await refreshActivity(a.id,a);let {data:all}=await sb.from('activity_responses').select('*').eq('activity_id',a.id);let unique=new Map((all||[]).map(x=>[x.sender,x]));if(unique.size>=2){await sb.from('activities').update({status:'completed'}).eq('id',a.id);let answers=[...unique.values()].map(x=>({name:x.response?.name||'Player',answer:x.response?.answer}));await callAI('Both players have answered. React to the answers, reveal them naturally, keep it short and fun, then continue with the next round if appropriate.','GameMaster',{activity:{type:a.activity_type,title:a.title,question:a.question,answers}})}}
async function refreshActivity(id,a0){let r=activityEls.get(id);if(!r)return;let {data:rs}=await sb.from('activity_responses').select('*').eq('activity_id',id).order('created_at');let unique=new Map((rs||[]).map(x=>[x.sender,x])),mine=unique.get(user.id),count=unique.size;[...r.querySelectorAll('.option')].forEach(b=>{if(b.tagName==='BUTTON')b.disabled=!!mine});r.querySelector('.wait').textContent=mine?(count<2?(lang==='ar'?'✓ إجابتك اتقفلت — مستني الطرف التاني…':'✓ Answer locked — waiting for the other player…'):(lang==='ar'?'✓ الاتنين جاوبوا':'✓ Both answered')):(lang==='ar'?'اختار إجابتك 👀':'Choose your answer 👀');let ans=r.querySelector('.answers'),secret=a0?.data?.secret!==false;if(count>=2||!secret){ans.classList.remove('hide');ans.innerHTML='';for(const x of unique.values()){let d=document.createElement('div');d.className='answer';d.textContent=(x.response?.name||'Player')+': '+(x.response?.answer??'');ans.append(d)}}}
async function loadRoom(){let {data:r,error}=await sb.from('rooms').select('*').eq('room_code',ROOM).single();if(error)throw error;room=r;let [mq,aq]=await Promise.all([sb.from('messages').select('*').eq('room_id',room.id).order('created_at'),sb.from('activities').select('*').eq('room_id',room.id).order('created_at')]);if(mq.error)throw mq.error;$('#chat').innerHTML='';seenMsg.clear();seenAct.clear();activityEls.clear();let items=[...(mq.data||[]).map(x=>({t:'m',x})),...(aq.data||[]).map(x=>({t:'a',x}))].sort((a,b)=>new Date(a.x.created_at)-new Date(b.x.created_at));for(const i of items)i.t==='m'?renderMessage(i.x):await renderActivity(i.x);bottom();subscribe()}
function subscribe(){for(const c of [msgCh,actCh,resCh])if(c)sb.removeChannel(c);msgCh=sb.channel('msg-'+room.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'room_id=eq.'+room.id},p=>renderMessage(p.new)).subscribe(s=>$('#st').textContent=s==='SUBSCRIBED'?(lang==='ar'?'متصل':'Connected'):(lang==='ar'?'يتصل…':'Connecting…'));actCh=sb.channel('act-'+room.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'activities',filter:'room_id=eq.'+room.id},p=>renderActivity(p.new)).subscribe();resCh=sb.channel('res-'+room.id).on('postgres_changes',{event:'*',schema:'public',table:'activity_responses'},p=>{let id=p.new?.activity_id||p.old?.activity_id;if(id&&activityEls.has(id)){let a={id,data:{secret:true}};refreshActivity(id,a)}}).subscribe()}
async function enter(u){user=u;$('#login').classList.add('hide');$('#main').classList.remove('hide');await loadRoom()}
function mentionCheck(){let v=$('#mi').value;$('#mention').classList.toggle('hide',!/(^|\s)@$/.test(v))}
function toast(s){let t=document.createElement('div');t.className='toast';t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),2600)}
async function boot(){ui();let mod=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');sb=mod.createClient(URL,KEY);let {data:{session}}=await sb.auth.getSession();if(session?.user)try{await enter(session.user)}catch(e){$('#err').textContent=e.message}}
$('#lf').onsubmit=async e=>{e.preventDefault();$('#err').textContent='';let {data,error}=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pass').value});if(error)return $('#err').textContent=error.message;try{await enter(data.user)}catch(x){$('#err').textContent=x.message}};
$('#mf').onsubmit=async e=>{e.preventDefault();let text=$('#mi').value.trim();if(!text||!room)return;$('#mi').value='';mentionCheck();let {error}=await sb.from('messages').insert({room_id:room.id,sender:user.id,sender_name:myName(),message_type:'text',content:text});if(error)return toast(error.message);if(/@AI\b/i.test(text))await callAI(text.replace(/@AI\b/ig,'').trim()||'Talk to us naturally.','Chat')};
$('#mi').oninput=e=>{e.target.style.height='46px';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px';mentionCheck()};$('#pickAI').onclick=()=>{let t=$('#mi');t.value=t.value.replace(/@$/,'@AI ');$('#mention').classList.add('hide');t.focus()};
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>callAI(lang==='ar'?`ابدأ ${b.dataset.mode} دلوقتي. متشرحش كتير؛ لو ينفع خليه تفاعلي بأزرار أو إجابات.`:`Start a ${b.dataset.mode} now. Do not over-explain; make it interactive when useful.`,b.dataset.mode));
$('#lang').onclick=()=>{lang=lang==='en'?'ar':'en';localStorage.setItem('ms_lang',lang);ui()};$('#out').onclick=async()=>{await sb.auth.signOut();location.reload()};window.visualViewport?.addEventListener('resize',bottom);boot();
</script></body></html>
